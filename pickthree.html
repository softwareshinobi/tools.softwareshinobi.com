<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryland Pick 3 Generator</title>
    <!-- Load Bootswatch Quartz Theme (uses Bootstrap 5.3) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #363945; /* Dark background from Quartz theme */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .generator-card {
            background-color: #2c2e36; /* Card background color */
            border: 1px solid #4a4e61;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 500px; /* Slightly wider card for three digits */
        }
        .result-display {
            background-color: #1a1b21;
            border-radius: 8px;
            padding: 20px 15px;
            margin-top: 20px;
            margin-bottom: 25px;
            text-align: center;
            height: 150px;
            /* Flex layout for three digits */
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: space-around;
            align-items: center;
            overflow: hidden;
        }
        .digit-container {
            flex-grow: 1;
            text-align: center;
        }
        .result-number {
            font-size: 4rem; /* Large font for the result */
            font-weight: 700;
            color: #d7d9e0; /* Light text color */
            line-height: 1;
            transition: opacity 0.3s ease;
        }
        .form-label {
            color: #b0b4c7;
        }
        .btn-custom {
            background-color: #5d5dff; /* Primary color from Quartz */
            border-color: #5d5dff;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-custom:hover {
            background-color: #4848cc;
            border-color: #4848cc;
            transform: translateY(-1px);
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(93, 93, 255, 0.25);
            border-color: #5d5dff;
        }
    </style>
</head>
<body>

    <div class="generator-card">
        <h3 class="text-white text-center mb-4">⭐ Maryland Pick 3 Generator ⭐</h3>
        <p class="text-secondary text-center">Numbers are generated randomly, inclusive from 1 to 9.</p>

        <form id="generatorForm">

            <div class="result-display mt-4">
                <!-- Digit 1 -->
                <div class="digit-container">
                    <div class="result-number" id="digit1">-</div>
                </div>
                <!-- Digit 2 -->
                <div class="digit-container">
                    <div class="result-number" id="digit2">-</div>
                </div>
                <!-- Digit 3 -->
                <div class="digit-container">
                    <div class="result-number" id="digit3">-</div>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-custom btn-lg">Generate Pick 3 Numbers</button>
            </div>
        </form>
    </div>

    <!-- Load jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Load Bootstrap JS (required for some components, though not strictly needed here) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {

            // Set up Firebase variables (Mandatory setup, even if not used)
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            // Note: Firebase setup is included here for environment compliance but not used for this local calculation.

            const $form = $('#generatorForm');
            const $button = $form.find('button[type="submit"]');

            // Array of jQuery objects for the three digits
            const $digits = [$('#digit1'), $('#digit2'), $('#digit3')];

            // Function to generate a single digit (inclusive 1 to 9)
            function generateDigit() {
                // Formula for inclusive range [1, 9]
                const min = 1;
                const max = 9;
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // Global variable for the animation interval
            let animationInterval;

            $form.on('submit', function(e) {
                e.preventDefault();

                // Clear any previous animation
                clearInterval(animationInterval);
                $button.prop('disabled', true).text('Rolling...');

                // --- Animation Effect (Rolling Numbers) ---
                let rollCount = 0;
                const totalRolls = 18; // Increased rolls for a slightly longer animation
                const rollDuration = 1200; // 1.2 seconds total duration
                const intervalTime = rollDuration / totalRolls; // ~66ms per roll

                // Start the rolling animation
                animationInterval = setInterval(function() {
                    if (rollCount < totalRolls) {
                        // Roll all three digits simultaneously
                        $digits.forEach(($digit) => {
                            $digit.text(generateDigit());
                        });
                        rollCount++;
                    } else {
                        // Stop animation and display final results
                        clearInterval(animationInterval);

                        // Generate the final result for each digit
                        $digits.forEach(($digit) => {
                            const finalResult = generateDigit();

                            // Small bounce effect before setting final number
                            $digit.css({ transform: 'scale(1.1)', opacity: 0.8 });

                            setTimeout(function() {
                                $digit.text(finalResult).css({
                                    transform: 'scale(1)',
                                    opacity: 1,
                                    transition: 'transform 0.3s ease, opacity 0.3s ease'
                                });
                            }, 200);
                        });

                        // Re-enable button after the animation and transition are complete
                        setTimeout(() => {
                            $button.prop('disabled', false).text('Generate Pick 3 Numbers');
                        }, 500);
                    }
                }, intervalTime);
            });
        });
    </script>
</body>
</html>
