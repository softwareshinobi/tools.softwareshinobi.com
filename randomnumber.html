<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
    <!-- Load Bootswatch Quartz Theme (uses Bootstrap 5.3) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #363945; /* Dark background from Quartz theme */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .generator-card {
            background-color: #2c2e36; /* Card background color */
            border: 1px solid #4a4e61;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 450px;
        }
        .result-display {
            background-color: #1a1b21;
            border-radius: 8px;
            padding: 20px 15px;
            margin-top: 20px;
            margin-bottom: 25px;
            text-align: center;
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents text overflow during animation */
            transition: background-color 0.3s ease;
        }
        .result-number {
            font-size: 5rem; /* Large font for the result */
            font-weight: 700;
            color: #d7d9e0; /* Light text color */
            line-height: 1;
            transition: opacity 0.3s ease;
        }
        .form-label {
            color: #b0b4c7;
        }
        .btn-custom {
            background-color: #5d5dff; /* Primary color from Quartz */
            border-color: #5d5dff;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-custom:hover {
            background-color: #4848cc;
            border-color: #4848cc;
            transform: translateY(-1px);
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(93, 93, 255, 0.25);
            border-color: #5d5dff;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="generator-card">
        <h3 class="text-white text-center mb-4">🔮 Quartz RNG</h3>

        <form id="generatorForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="lowestNumber" class="form-label">Lowest Number (Min)</label>
                    <input type="number" class="form-control" id="lowestNumber" value="1" min="0" required>
                </div>
                <div class="col-md-6">
                    <label for="highestNumber" class="form-label">Highest Number (Max)</label>
                    <input type="number" class="form-control" id="highestNumber" value="100" min="1" required>
                </div>
            </div>
            <div id="validationMessage" class="error-message text-center mt-3" style="display: none;"></div>

            <div class="result-display mt-4">
                <div class="result-number" id="resultNumber">--</div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-custom btn-lg">Generate Random Number</button>
            </div>
        </form>
    </div>

    <!-- Load jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Load Bootstrap JS (required for some components, though not strictly needed here, it's good practice) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {

            // Set up Firebase variables (Mandatory setup, even if not used)
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            // Note: Firebase setup is included here for environment compliance but not used for this local calculation.

            const $form = $('#generatorForm');
            const $minInput = $('#lowestNumber');
            const $maxInput = $('#highestNumber');
            const $resultDisplay = $('#resultNumber');
            const $validationMessage = $('#validationMessage');
            const $button = $form.find('button[type="submit"]');

            // Function to generate the random number (inclusive)
            function generateRandomNumber(min, max) {
                // Formula: Math.floor(Math.random() * (max - min + 1)) + min
                min = Math.ceil(min);
                max = Math.floor(max);
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // Global variable for the animation interval
            let animationInterval;

            $form.on('submit', function(e) {
                e.preventDefault();

                // Clear any previous animation
                clearInterval(animationInterval);
                $button.prop('disabled', true).text('Generating...');
                $validationMessage.slideUp();

                let min = parseInt($minInput.val());
                let max = parseInt($maxInput.val());

                // --- Input Validation ---
                if (isNaN(min) || isNaN(max)) {
                    $validationMessage.text('Please enter valid numbers for both fields.').slideDown();
                    $resultDisplay.text('ERROR');
                    $button.prop('disabled', false).text('Generate Random Number');
                    return;
                }

                if (min >= max) {
                    $validationMessage.text('The lowest number must be strictly less than the highest number.').slideDown();
                    $resultDisplay.text('ERROR');
                    $button.prop('disabled', false).text('Generate Random Number');
                    return;
                }

                // --- Animation Effect (Rolling Numbers) ---
                let rollCount = 0;
                const totalRolls = 15;
                const rollDuration = 1000; // 1 second total duration
                const intervalTime = rollDuration / totalRolls;

                // Start the rolling animation
                animationInterval = setInterval(function() {
                    if (rollCount < totalRolls) {
                        // Display a temporary random number within the range
                        const tempNum = generateRandomNumber(min, max);
                        $resultDisplay.text(tempNum);
                        rollCount++;
                    } else {
                        // Stop animation and display final result
                        clearInterval(animationInterval);

                        // Generate the final result
                        const finalResult = generateRandomNumber(min, max);

                        // Small bounce effect (optional: requires bootstrap utilities)
                        $resultDisplay.css({ transform: 'scale(1.1)', opacity: 0.8 });

                        setTimeout(function() {
                            $resultDisplay.text(finalResult).css({
                                transform: 'scale(1)',
                                opacity: 1,
                                transition: 'transform 0.3s ease, opacity 0.3s ease'
                            });
                            $button.prop('disabled', false).text('Generate Random Number');
                        }, 200);
                    }
                }, intervalTime); // Execute every 66ms (1000ms / 15 rolls)
            });

            // Prevent negative inputs and enforce integer values on blur
            $minInput.on('blur change', function() {
                let val = Math.floor(Math.max(0, parseInt($(this).val() || 0)));
                $(this).val(val);
            });

            $maxInput.on('blur change', function() {
                let val = Math.floor(Math.max(1, parseInt($(this).val() || 1)));
                $(this).val(val);
            });
        });
    </script>
</body>
</html>
