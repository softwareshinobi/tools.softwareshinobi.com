<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Portal</title>
    <!-- Load Bootswatch Quartz Theme (uses Bootstrap 5.3) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #363945; /* Dark background from Quartz theme */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .portal-container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        .app-card {
            background-color: #2c2e36;
            border: 1px solid #4a4e61;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none; /* Remove link underline */
            color: inherit;
            display: block;
            margin-bottom: 20px;
            padding: 25px;
        }
        .app-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(93, 93, 255, 0.15); /* Light glow on hover */
            border-color: #5d5dff;
        }
        .app-card h5 {
            color: #d7d9e0;
            font-weight: 600;
        }
        .app-card p {
            color: #b0b4c7;
        }
        .header-title {
            color: #d7d9e0;
            font-size: 2.5rem;
            margin-bottom: 30px;
            border-bottom: 2px solid #5d5dff;
            display: inline-block;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <h1 class="header-title">My Application Portal</h1>

        <div class="row">
            <div class="col-md-6">
                <!-- Link to the first project -->
                <a href="randomnumber.html" class="app-card">
                    <h5>🎲 General Random Number Generator</h5>
                    <p class="mb-0">Generate a single random number between a custom minimum and maximum value.</p>
                </a>
            </div>
            <div class="col-md-6">
                <!-- Link to the second project -->
                <a href="pickthree.html" class="app-card">
                    <h5>⭐ Maryland Pick 3 Generator</h5>
                    <p class="mb-0">Generate three random digits (1-9) for a lottery-style selection.</p>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
